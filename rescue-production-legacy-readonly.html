<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本番旧形式救出診断（読取専用）</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:20px;line-height:1.55;color:#17212b}h1{font-size:24px}.note{border:2px solid #176273;border-radius:12px;padding:14px;margin:12px 0}.warn{border-color:#9a5b00;background:#fff7e6}.ok{border-color:#287a3d;background:#eefaf1}table{border-collapse:collapse;width:100%;font-size:13px;margin:10px 0 20px}th,td{border:1px solid #bbb;padding:7px;text-align:left;vertical-align:top}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f6f8;padding:12px;border-radius:8px}button{font-size:16px;padding:12px 16px}</style></head><body><h1>本番旧形式救出診断（読取専用）</h1><div class="note"><b>旧形式の退避キーと給与シミュレーター関連キーだけを確認します。</b><br>保存・変更・削除・復元・外部送信は行いません。</div><div id="summary"></div><table><thead><tr><th>キー</th><th>存在</th><th>JSON</th><th>種別</th><th>entries</th><th>history</th><th>文字数</th></tr></thead><tbody id="rows"></tbody></table><button id="copy">診断結果をコピー</button><pre id="out"></pre><script>(()=>{'use strict';const exact=['taxiPayStateSafetyBackupsV1','taxiPayStateDiagnosticsV1','taxiPayRecoverySnapshotsV1','taxiPayStorageDiagnosticsV1','taxiPayPwaStateV10','taxiPayPwaStateV9','taxiPayPwaStateV8','taxiPayPwaStateV7','taxiPayPwaStateV6','taxiPayPwaStateV5','taxiPayPwaStateV4','taxiPayPwaStateV3','taxiPayPwaStateV2','taxiPayPwaStateV1'];const discovered=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&/^taxiPay/i.test(k)&&!exact.includes(k))discovered.push(k)}}catch{}const keys=[...exact,...discovered.sort()];function inspectState(x){return {entries:Array.isArray(x?.entries)?x.entries.length:null,history:Array.isArray(x?.history)?x.history.length:null}}function inspectBackupArray(a){let maxE=0,maxH=0,items=[];for(let i=0;i<a.length;i++){const it=a[i];let data=it?.data??it?.state??null;if(!data&&typeof it?.raw==='string'){try{data=JSON.parse(it.raw)}catch{}}const s=inspectState(data);maxE=Math.max(maxE,Number(s.entries)||0);maxH=Math.max(maxH,Number(s.history)||0);items.push({index:i,at:it?.at??it?.createdAt??null,sourceKey:it?.sourceKey??null,reason:it?.reason??null,entries:s.entries,history:s.history,data});}return {maxE,maxH,items}}const reportRows=[];for(const key of keys){let raw=null;try{raw=localStorage.getItem(key)}catch(e){reportRows.push({key,error:String(e)});continue}if(raw===null){reportRows.push({key,exists:false,length:0});continue}let parsed=null,valid=false;try{parsed=JSON.parse(raw);valid=true}catch{}let type='json';let entries=null,history=null,backupItems=null;if(valid){if(Array.isArray(parsed)){type='array';const b=inspectBackupArray(parsed);entries=b.maxE;history=b.maxH;backupItems=b.items}else{const s=inspectState(parsed);entries=s.entries;history=s.history}}reportRows.push({key,exists:true,valid,length:raw.length,type,entries,history,backupItems,parsed: key==='taxiPayStateSafetyBackupsV1'?parsed:undefined})}const hits=reportRows.filter(r=>(Number(r.entries)||0)+(Number(r.history)||0)>0);document.getElementById('summary').innerHTML=hits.length?`<div class="note ok"><b>実データ入り候補 ${hits.length}件を検出しました。</b></div>`:'<div class="note warn"><b>この旧形式診断では実データ入り候補はまだ見つかっていません。</b></div>';const tb=document.getElementById('rows');for(const r of reportRows){const tr=document.createElement('tr');[r.key,r.exists?'あり':'なし',r.exists?(r.valid?'正常':'解析不可'):'—',r.type||'—',r.entries??'—',r.history??'—',r.length??0].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td)});tb.appendChild(tr)}const report={generatedAt:new Date().toISOString(),origin:location.origin,userAgent:navigator.userAgent,rows:reportRows.map(r=>({key:r.key,exists:r.exists,valid:r.valid,length:r.length,type:r.type,entries:r.entries,history:r.history,backupItems:r.backupItems}))};const text=JSON.stringify(report,null,2);document.getElementById('out').textContent=text;document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(text);alert('診断結果をコピーしました。')}catch{alert('コピーできませんでした。')}}})();</script></body></html>
