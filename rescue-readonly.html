<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>給与シミュレーター データ救出診断（読取専用）</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:20px;line-height:1.55;color:#17212b}h1{font-size:24px}.note{border:2px solid #176273;border-radius:12px;padding:14px}.warn{border-color:#9a5b00;background:#fff7e6}.ok{border-color:#287a3d;background:#eefaf1}table{border-collapse:collapse;width:100%;font-size:14px}th,td{border:1px solid #bbb;padding:7px;text-align:left;vertical-align:top}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f6f8;padding:12px;border-radius:8px}button{font-size:16px;padding:12px 16px;margin:6px 6px 6px 0}</style></head><body>
<h1>データ救出診断（読取専用）</h1><div class="note"><b>このページは保存・変更・削除・復元・外部送信を行いません。</b><br>このブラウザの localStorage を読み取るだけです。</div>
<p id="summary"></p><div id="table"></div><h2>救出候補</h2><div id="candidates"></div><button id="copy">診断結果をコピー</button><pre id="raw"></pre>
<script>
(()=>{'use strict';
 const rows=[],candidates=[]; const keys=[]; for(let i=0;i<localStorage.length;i++) keys.push(localStorage.key(i)); keys.sort();
 for(const key of keys){let raw=null,parsed=null,valid=false; try{raw=localStorage.getItem(key)}catch(e){} try{parsed=JSON.parse(raw);valid=true}catch(e){}
  const entries=valid&&Array.isArray(parsed?.entries)?parsed.entries.length:null; const history=valid&&Array.isArray(parsed?.history)?parsed.history.length:null;
  const likely=/taxiPayPwa(State|DevelopState)V\d+/.test(key)||((entries??0)+(history??0)>0);
  const row={key,length:raw?.length||0,json:valid,entries,history,initialized:valid?parsed?.initialized:null,likely}; rows.push(row);
  if(likely&&valid)candidates.push({key,score:(entries||0)+(history||0),entries,history,initialized:parsed?.initialized,data:parsed});
 }
 candidates.sort((a,b)=>b.score-a.score);
 document.getElementById('summary').innerHTML=`Origin: <b>${location.origin}</b><br>localStorageキー: ${rows.length}件 / 救出候補: ${candidates.length}件`;
 document.getElementById('table').innerHTML='<table><tr><th>キー</th><th>JSON</th><th>entries</th><th>history</th><th>文字数</th></tr>'+rows.map(r=>`<tr><td>${r.key}</td><td>${r.json?'正常':'非JSON'}</td><td>${r.entries??'—'}</td><td>${r.history??'—'}</td><td>${r.length}</td></tr>`).join('')+'</table>';
 document.getElementById('candidates').innerHTML=candidates.length?candidates.map(c=>`<div class="note ${c.score>0?'ok':'warn'}"><b>${c.key}</b>：entries=${c.entries??'—'} / history=${c.history??'—'} / initialized=${String(c.initialized)}</div>`).join(''):'<div class="note warn">候補データは見つかりませんでした。このブラウザ以外（Safari/Chrome等）も別途確認が必要です。</div>';
 const report={generatedAt:new Date().toISOString(),origin:location.origin,userAgent:navigator.userAgent,rows,candidates:candidates.map(c=>({key:c.key,score:c.score,entries:c.entries,history:c.history,initialized:c.initialized,data:c.data}))};
 const text=JSON.stringify(report,null,2); document.getElementById('raw').textContent=text;
 document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(text);alert('コピーしました。')}catch(e){alert('コピーできませんでした。画面の診断結果をスクリーンショットしてください。')}};
})();
</script></body></html>
