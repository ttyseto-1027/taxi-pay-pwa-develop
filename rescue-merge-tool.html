<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>本番データ救出 統合ツール</title><style>body{font-family:system-ui;margin:14px;line-height:1.55;color:#17212b}button,input{font-size:16px;max-width:100%}button{min-height:48px;padding:12px 14px;margin:8px 0;width:100%}.card{border:1px solid #ccd5da;border-radius:12px;padding:14px;margin:12px 0}.ok{border-color:#0f5968}.warn{border-color:#a06000;background:#fff8ea}.conflict{border:2px solid #a06000;border-radius:12px;padding:12px;margin:12px 0}.row{display:grid;grid-template-columns:1fr;gap:10px}.choice{border:1px solid #ccd5da;border-radius:10px;padding:12px}.choice pre{font-size:11px;white-space:pre-wrap;overflow-wrap:anywhere}.summary{font-weight:700}.hidden{display:none}.fileline{display:block;margin:14px 0}.fileline input{display:block;margin-top:6px;width:100%}pre#out{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;background:#f5f7f8;padding:12px;border-radius:8px}.src{font-size:13px;color:#53636d;margin-top:5px}</style></head><body><h1>本番データ救出・統合ツール</h1><div class="card warn"><b>スマホ対応・安全仕様</b><br>iPhone/Androidの「ファイル」からJSONを選べます。このページは救出JSONを統合するだけで、端末本番データ・DEVELOPデータ・Google Driveには書き込みません。</div><div class="card"><label class="fileline">救出JSON A<input id="a" type="file" accept="application/json,.json"><span id="ainfo" class="src">未選択</span></label><label class="fileline">救出JSON B<input id="b" type="file" accept="application/json,.json"><span id="binfo" class="src">未選択</span></label><button id="analyze">統合・競合を判定</button></div><div id="summary" class="card hidden"></div><div id="conflicts"></div><div id="actions" class="card hidden"><button id="build">選択内容で統合JSONを作る</button><button id="download" disabled>統合JSONを保存</button></div><pre id="out">2つの本番救出JSONを選択してください。</pre><script>const $=id=>document.getElementById(id);let aDoc=null,bDoc=null,plan=null,mergedDoc=null;function readFile(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{try{res(JSON.parse(r.result))}catch(e){rej(new Error('JSONを解析できません: '+e.message))}};r.onerror=()=>rej(new Error('ファイルを読み込めません'));r.readAsText(f)})}function validate(d,label){if(d?.rescueFormat!=='taxi-pay-production-rescue-v1')throw new Error(label+'は本番救出JSONではありません');if(d?.key!=='taxiPayPwaStateV10')throw new Error(label+'の保存キーが本番V10ではありません');if(!Array.isArray(d?.state?.entries)||!Array.isArray(d?.state?.history))throw new Error(label+'のstate形式が不正です')}function clone(x){return JSON.parse(JSON.stringify(x))}function stable(x){const y=clone(x);delete y.id;return JSON.stringify(y)}function fingerprint(d){return JSON.stringify({exportedAt:d.exportedAt,userAgent:d.userAgent,key:d.key,state:d.state})}function device(d){const u=String(d?.userAgent||'');if(/iPhone|iPad/.test(u))return'iPhone/iPad';if(/Android/.test(u))return'Android';if(/Windows/.test(u))return'Windows PC';if(/Macintosh/.test(u))return'Mac';return'端末不明'}function brief(x){return{date:x.date,id:x.id,grossRevenue:x.grossRevenue,grossSales:x.grossSales,adjustedGrossSales:x.adjustedGrossSales,clockIn:x.clockIn,clockOut:x.clockOut,normalBreakMinutes:x.normalBreakMinutes,nightBreakMinutes:x.nightBreakMinutes}}function analyzeEntries(a,b){const byDate=new Map();for(const[src,arr]of[['A',a],['B',b]])for(const e of arr){const d=String(e.date||'');if(!byDate.has(d))byDate.set(d,[]);byDate.get(d).push({src,e})}const non=[],conf=[];for(const[date,rows]of[...byDate].sort((x,y)=>x[0].localeCompare(y[0]))){if(rows.length===1){non.push(rows[0]);continue}const unique=[];for(const r of rows){if(!unique.some(u=>u.e.id===r.e.id&&stable(u.e)===stable(r.e)))unique.push(r)}if(unique.length===1){non.push(unique[0]);continue}conf.push({date,rows:unique})}return{non,conf}}function renderConflict(c,i){const wrap=document.createElement('div');wrap.className='conflict';wrap.innerHTML='<h3>競合 '+c.date+'</h3><p>同じ勤務日に異なる本番データがあります。残す方を選択してください。</p>';const row=document.createElement('div');row.className='row';for(const r of c.rows){const doc=r.src==='A'?aDoc:bDoc,box=document.createElement('label');box.className='choice';box.innerHTML='<input type="radio" name="c'+i+'" value="'+r.src+'"> <b>'+r.src+'（'+device(doc)+'）を採用</b><pre>'+JSON.stringify(brief(r.e),null,2)+'</pre>';row.appendChild(box)}wrap.appendChild(row);$('conflicts').appendChild(wrap)}async function preview(which){try{const f=$(which.toLowerCase()).files[0];if(!f)return;const d=await readFile(f);validate(d,which);$(which.toLowerCase()+'info').textContent=device(d)+' / '+d.state.entries.length+'件 / '+(d.state.entries.map(x=>x.date).filter(Boolean).sort().join(', ')||'日付なし')}catch(e){$(which.toLowerCase()+'info').textContent='エラー: '+e.message}}$('a').onchange=()=>preview('A');$('b').onchange=()=>preview('B');$('analyze').onclick=async()=>{try{const af=$('a').files[0],bf=$('b').files[0];if(!af||!bf)throw new Error('2つの救出JSONを選択してください');aDoc=await readFile(af);bDoc=await readFile(bf);validate(aDoc,'A');validate(bDoc,'B');if(fingerprint(aDoc)===fingerprint(bDoc))throw new Error('同じ救出JSONが2回選択されています。別の端末・別の救出JSONを選んでください。');plan=analyzeEntries(aDoc.state.entries,bDoc.state.entries);$('conflicts').innerHTML='';plan.conf.forEach(renderConflict);const dates=[...new Set([...aDoc.state.entries,...bDoc.state.entries].map(x=>x.date))].sort();$('summary').className='card ok';$('summary').innerHTML='<div class="summary">A '+aDoc.state.entries.length+'件（'+device(aDoc)+'） / B '+bDoc.state.entries.length+'件（'+device(bDoc)+'） / 対象日 '+dates.length+'日 / 競合 '+plan.conf.length+'日</div><div>非競合は自動統合し、競合日のみ選択します。</div>';$('summary').classList.remove('hidden');$('actions').classList.remove('hidden');$('out').textContent=JSON.stringify({a:{device:device(aDoc),exportedAt:aDoc.exportedAt,dates:aDoc.state.entries.map(x=>x.date)},b:{device:device(bDoc),exportedAt:bDoc.exportedAt,dates:bDoc.state.entries.map(x=>x.date)},conflictDates:plan.conf.map(x=>x.date),expectedMergedDates:dates},null,2);mergedDoc=null;$('download').disabled=true}catch(e){$('summary').classList.add('hidden');$('actions').classList.add('hidden');$('conflicts').innerHTML='';$('out').textContent='ERROR: '+e.message}};$('build').onclick=()=>{try{if(!plan)throw new Error('先に統合・競合を判定してください');const entries=plan.non.map(x=>clone(x.e));for(let i=0;i<plan.conf.length;i++){const c=plan.conf[i],sel=document.querySelector('input[name="c'+i+'"]:checked');if(!sel)throw new Error(c.date+' の競合で採用データを選んでください');const r=c.rows.find(x=>x.src===sel.value);entries.push(clone(r.e))}entries.sort((x,y)=>String(x.date).localeCompare(String(y.date)));const base=clone(aDoc.state);base.entries=entries;const historyMap=new Map();for(const h of[...aDoc.state.history,...bDoc.state.history]){const k=JSON.stringify(h);if(!historyMap.has(k))historyMap.set(k,h)}base.history=[...historyMap.values()].map(clone);mergedDoc={rescueFormat:'taxi-pay-production-rescue-merged-v1',createdAt:new Date().toISOString(),source:{a:{device:device(aDoc),exportedAt:aDoc.exportedAt},b:{device:device(bDoc),exportedAt:bDoc.exportedAt}},key:'taxiPayPwaStateV10',state:base,summary:{entries:entries.length,history:base.history.length,dates:entries.map(x=>x.date),resolvedConflicts:plan.conf.map((c,i)=>({date:c.date,selected:document.querySelector('input[name="c'+i+'"]:checked')?.value||''}))}};$('out').textContent=JSON.stringify(mergedDoc,null,2);$('download').disabled=false}catch(e){$('out').textContent='ERROR: '+e.message}};$('download').onclick=()=>{if(!mergedDoc)return;const b=new Blob([JSON.stringify(mergedDoc,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='taxi-pay-production-merged-'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};</script></body></html>
