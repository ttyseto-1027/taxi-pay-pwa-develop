<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本番データ救出 統合ツール</title><style>body{font-family:system-ui;margin:18px;line-height:1.55;color:#17212b}button,input{font-size:16px}button{padding:10px 14px;margin:8px 8px 8px 0}.card{border:1px solid #ccd5da;border-radius:10px;padding:14px;margin:12px 0}.ok{border-color:#0f5968}.warn{border-color:#a06000;background:#fff8ea}.conflict{border:2px solid #a06000;border-radius:10px;padding:12px;margin:12px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{border:1px solid #ccd5da;border-radius:8px;padding:10px}.choice pre{font-size:11px;white-space:pre-wrap;overflow-wrap:anywhere}.summary{font-weight:700}.hidden{display:none}pre#out{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;background:#f5f7f8;padding:12px;border-radius:8px}@media(max-width:700px){.row{grid-template-columns:1fr}}</style></head><body><h1>本番データ救出・統合ツール</h1><div class="card warn"><b>安全仕様</b><br>このページはPC/スマホから書き出した救出JSONを統合するだけです。端末の本番データ・DEVELOPデータ・Google Driveには書き込みません。</div><div class="card"><label>PC本番の救出JSON<br><input id="pc" type="file" accept="application/json,.json"></label><br><label>スマホ本番の救出JSON<br><input id="sp" type="file" accept="application/json,.json"></label><br><button id="analyze">統合・競合を判定</button></div><div id="summary" class="card hidden"></div><div id="conflicts"></div><div id="actions" class="card hidden"><button id="build">選択内容で統合JSONを作る</button><button id="download" disabled>統合JSONをダウンロード</button></div><pre id="out">PCとスマホの救出JSONを選択してください。</pre><script>const $=id=>document.getElementById(id);let pcDoc=null,spDoc=null,plan=null,mergedDoc=null;function readFile(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{try{res(JSON.parse(r.result))}catch(e){rej(new Error('JSONを解析できません: '+e.message))}};r.onerror=()=>rej(new Error('ファイルを読み込めません'));r.readAsText(f)})}function validate(d,label){if(d?.rescueFormat!=='taxi-pay-production-rescue-v1')throw new Error(label+'は本番救出JSONではありません');if(d?.key!=='taxiPayPwaStateV10')throw new Error(label+'の保存キーが本番V10ではありません');if(!Array.isArray(d?.state?.entries)||!Array.isArray(d?.state?.history))throw new Error(label+'のstate形式が不正です')}function clone(x){return JSON.parse(JSON.stringify(x))}function stable(x){const y=clone(x);delete y.id;return JSON.stringify(y)}function brief(x){return {date:x.date,id:x.id,grossRevenue:x.grossRevenue,grossSales:x.grossSales,adjustedGrossSales:x.adjustedGrossSales,clockIn:x.clockIn,clockOut:x.clockOut,normalBreakMinutes:x.normalBreakMinutes,nightBreakMinutes:x.nightBreakMinutes}}function analyzeEntries(pc,sp){const byDate=new Map();for(const [src,arr] of [['PC',pc],['スマホ',sp]])for(const e of arr){const d=String(e.date||'');if(!byDate.has(d))byDate.set(d,[]);byDate.get(d).push({src,e})}const non=[],conf=[];for(const [date,rows] of [...byDate].sort((a,b)=>a[0].localeCompare(b[0]))){if(rows.length===1){non.push(rows[0]);continue}const unique=[];for(const r of rows){if(!unique.some(u=>u.e.id===r.e.id&&stable(u.e)===stable(r.e)))unique.push(r)}if(unique.length===1){non.push(unique[0]);continue}conf.push({date,rows:unique})}return{non,conf}}function renderConflict(c,i){const wrap=document.createElement('div');wrap.className='conflict';wrap.innerHTML='<h3>競合 '+c.date+'</h3><p>同じ勤務日に異なる本番データがあります。残す方を選択してください。</p>';const row=document.createElement('div');row.className='row';for(const r of c.rows){const box=document.createElement('label');box.className='choice';const id='c'+i+'-'+r.src;box.innerHTML='<input type="radio" name="c'+i+'" value="'+r.src+'"> <b>'+r.src+'版を採用</b><pre>'+JSON.stringify(brief(r.e),null,2)+'</pre>';row.appendChild(box)}wrap.appendChild(row);$('conflicts').appendChild(wrap)}$('analyze').onclick=async()=>{try{const pf=$('pc').files[0],sf=$('sp').files[0];if(!pf||!sf)throw new Error('PCとスマホ両方の救出JSONを選択してください');pcDoc=await readFile(pf);spDoc=await readFile(sf);validate(pcDoc,'PC');validate(spDoc,'スマホ');plan=analyzeEntries(pcDoc.state.entries,spDoc.state.entries);$('conflicts').innerHTML='';plan.conf.forEach(renderConflict);const dates=[...new Set([...pcDoc.state.entries,...spDoc.state.entries].map(x=>x.date))].sort();$('summary').className='card ok';$('summary').innerHTML='<div class="summary">PC '+pcDoc.state.entries.length+'件 / スマホ '+spDoc.state.entries.length+'件 / 対象日 '+dates.length+'日 / 競合 '+plan.conf.length+'日</div><div>非競合は自動統合し、競合日のみ選択します。</div>'; $('summary').classList.remove('hidden');$('actions').classList.remove('hidden');$('out').textContent=JSON.stringify({pcDates:pcDoc.state.entries.map(x=>x.date),smartphoneDates:spDoc.state.entries.map(x=>x.date),conflictDates:plan.conf.map(x=>x.date),expectedMergedDates:dates},null,2);mergedDoc=null;$('download').disabled=true}catch(e){$('out').textContent='ERROR: '+e.message}};$('build').onclick=()=>{try{if(!plan)throw new Error('先に統合・競合を判定してください');const entries=plan.non.map(x=>clone(x.e));for(let i=0;i<plan.conf.length;i++){const c=plan.conf[i],sel=document.querySelector('input[name="c'+i+'"]:checked');if(!sel)throw new Error(c.date+' の競合で採用データを選んでください');const r=c.rows.find(x=>x.src===sel.value);entries.push(clone(r.e))}entries.sort((a,b)=>String(a.date).localeCompare(String(b.date)));const base=clone(pcDoc.state);base.entries=entries;const historyMap=new Map();for(const h of [...pcDoc.state.history,...spDoc.state.history]){const k=JSON.stringify(h);if(!historyMap.has(k))historyMap.set(k,h)}base.history=[...historyMap.values()].map(clone);mergedDoc={rescueFormat:'taxi-pay-production-rescue-merged-v1',createdAt:new Date().toISOString(),source:{pcExportedAt:pcDoc.exportedAt,smartphoneExportedAt:spDoc.exportedAt},key:'taxiPayPwaStateV10',state:base,summary:{entries:entries.length,history:base.history.length,dates:entries.map(x=>x.date),resolvedConflicts:plan.conf.map((c,i)=>({date:c.date,selected:document.querySelector('input[name="c'+i+'"]:checked')?.value||''}))}};$('out').textContent=JSON.stringify(mergedDoc,null,2);$('download').disabled=false}catch(e){$('out').textContent='ERROR: '+e.message}};$('download').onclick=()=>{if(!mergedDoc)return;const b=new Blob([JSON.stringify(mergedDoc,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='taxi-pay-production-merged-'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};</script></body></html>
