<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Google Drive 読取専用診断</title><style>body{font-family:system-ui;margin:18px;color:#17212b;line-height:1.55}button{font-size:16px;padding:12px;margin:8px 8px 8px 0}.note{padding:12px;border:2px solid #0f5968;border-radius:10px}.warn{padding:12px;border:2px solid #9a5b00;border-radius:10px;background:#fff7e6}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;background:#f5f7f8;padding:12px;border-radius:8px}</style><script src="firebase-config.js"></script></head><body><h1>Google Drive 読取専用診断</h1><p class="note">Google Driveへの書き込み・削除・復元・バックアップは行いません。Drive権限取得後にファイル一覧APIを1回だけ読み取ります。</p><p class="warn">PCなど通常のログイン状態が復元できる端末は「既存ログインで診断」を使用します。iPhone等で認証復元が止まる場合は「Googleログインして診断」を押してください。どちらもDriveへ書き込みません。</p><button id="runExisting" type="button">既存ログインで診断</button><button id="runDirect" type="button">Googleログインして診断</button><button id="copy" type="button">診断結果をコピー</button><pre id="out">準備中...</pre><script type="module">import{initializeApp,getApps}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';import{getAuth,GoogleAuthProvider,onAuthStateChanged,reauthenticateWithPopup,signInWithPopup}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';const out=document.getElementById('out'),runExisting=document.getElementById('runExisting'),runDirect=document.getElementById('runDirect'),copy=document.getElementById('copy');const rows=[];const mask=e=>{const s=String(e||''),p=s.split('@');return p.length===2?(p[0].slice(0,2)+'***@'+p[1]):''};function add(stage,data={}){rows.push({at:new Date().toISOString(),stage,...data});out.textContent=JSON.stringify({generatedAt:new Date().toISOString(),href:location.href,userAgent:navigator.userAgent,online:navigator.onLine,popupLikelyBlocked:!('open'in window),steps:rows},null,2)};let auth=null,user=null;try{const cfg=window.TAXI_PAY_FIREBASE_CONFIG||{};if(!cfg.apiKey)throw new Error('Firebase config missing');const app=getApps().length?getApps()[0]:initializeApp(cfg);auth=getAuth(app);add('firebase-initialized',{authDomain:cfg.authDomain||''});onAuthStateChanged(auth,u=>{user=u||null;add('auth-state',{signedIn:!!u,emailMasked:mask(u?.email),providerIds:(u?.providerData||[]).map(x=>x.providerId)})});}catch(e){add('init-error',{code:e?.code||'',message:String(e?.message||e)})}function driveProvider(email=''){const provider=new GoogleAuthProvider();provider.addScope('https://www.googleapis.com/auth/drive.file');provider.setCustomParameters(email?{prompt:'consent',login_hint:email}:{prompt:'consent'});return provider}async function finishDriveRead(result,expectedUid=''){add('popup-returned',{selectedEmailMasked:mask(result?.user?.email)});if(expectedUid&&String(result?.user?.uid||'')!==String(expectedUid))throw Object.assign(new Error('別のGoogleアカウントが選択されました。'),{code:'diag/user-mismatch'});const cred=GoogleAuthProvider.credentialFromResult(result);const token=cred?.accessToken||'';add('token-result',{accessTokenPresent:!!token});if(!token)throw Object.assign(new Error('Google Drive用アクセストークンを取得できませんでした。'),{code:'diag/no-access-token'});add('drive-read-start');const r=await fetch('https://www.googleapis.com/drive/v3/files?pageSize=1&spaces=drive&fields=files(id,name)',{headers:{Authorization:`Bearer ${token}`}});let body='';try{body=await r.text()}catch{}add('drive-read-result',{status:r.status,ok:r.ok,responsePreview:body.slice(0,500)});if(!r.ok)throw Object.assign(new Error('Drive API読取に失敗しました。'),{code:'diag/drive-read-failed',httpStatus:r.status});add('diagnostic-success',{message:'Drive権限取得と読取APIの両方に成功しました。書き込みは行っていません。'});}runExisting.addEventListener('click',async()=>{runExisting.disabled=true;add('existing-button-click',{visibilityState:document.visibilityState});try{if(!auth)throw Object.assign(new Error('Firebase認証を初期化できません。'),{code:'diag/no-auth'});add('auth-restore-wait-start');if(typeof auth.authStateReady==='function'){await Promise.race([auth.authStateReady(),new Promise((_,reject)=>setTimeout(()=>reject(Object.assign(new Error('Firebaseログイン状態の復元が10秒以内に完了しませんでした。'),{code:'diag/auth-restore-timeout'})),10000))]);}user=auth.currentUser||user;add('auth-restore-wait-end',{signedIn:!!user,emailMasked:mask(user?.email)});if(!user)throw Object.assign(new Error('Googleログイン状態を確認できません。'),{code:'diag/not-signed-in'});add('reauth-popup-start',{emailMasked:mask(user.email)});const result=await reauthenticateWithPopup(user,driveProvider(user.email||''));await finishDriveRead(result,user.uid);}catch(e){add('diagnostic-error',{code:e?.code||'',name:e?.name||'',message:String(e?.message||e)});}finally{runExisting.disabled=false}});runDirect.addEventListener('click',async()=>{runDirect.disabled=true;add('direct-button-click',{visibilityState:document.visibilityState});try{if(!auth)throw Object.assign(new Error('Firebase認証を初期化できません。'),{code:'diag/no-auth'});add('direct-signin-popup-start');const result=await signInWithPopup(auth,driveProvider());await finishDriveRead(result,'');}catch(e){add('diagnostic-error',{code:e?.code||'',name:e?.name||'',message:String(e?.message||e)});}finally{runDirect.disabled=false}});copy.addEventListener('click',async()=>{const text=out.textContent;try{await navigator.clipboard.writeText(text);alert('コピーしました')}catch{window.prompt('下の診断結果をコピーしてください。',text)}});</script></body></html>
