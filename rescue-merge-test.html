<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本番データ救出 統合テスト</title><style>body{font-family:system-ui;margin:18px;line-height:1.55;color:#17212b}button{font-size:16px;padding:12px;margin:8px 8px 8px 0}.note{padding:12px;border:2px solid #0f5968;border-radius:10px}.warn{padding:12px;border:2px solid #9a5b00;border-radius:10px;background:#fff7e6}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;background:#f5f7f8;padding:12px;border-radius:8px}</style></head><body><h1>本番データ救出・統合テスト</h1><p class="note">本番キー taxiPayPwaStateV10 だけを扱います。DEVELOPキーは読みません。このページでは書き込みません。</p><p class="warn">PCとスマホそれぞれで「本番JSONを書き出す」を押し、保存されたJSONを確保してください。その後の統合・競合解決は救出JSONを使って行います。</p><button id="export">本番JSONを書き出す</button><button id="copy">本番JSONをコピー</button><pre id="out">準備完了</pre><script>const KEY='taxiPayPwaStateV10',out=document.getElementById('out');function get(){const raw=localStorage.getItem(KEY);if(!raw)throw new Error(KEY+' がありません');const s=JSON.parse(raw);return{rescueFormat:'taxi-pay-production-rescue-v1',exportedAt:new Date().toISOString(),origin:location.origin,userAgent:navigator.userAgent,key:KEY,state:s,summary:{entries:Array.isArray(s.entries)?s.entries.length:0,history:Array.isArray(s.history)?s.history.length:0,dates:(Array.isArray(s.entries)?s.entries:[]).map(x=>x.date).filter(Boolean).sort()}}}function text(){const x=get();out.textContent=JSON.stringify(x,null,2);return out.textContent}document.getElementById('export').onclick=()=>{try{const t=text(),b=new Blob([t],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='taxi-pay-production-rescue-'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}catch(e){out.textContent='ERROR: '+e.message}};document.getElementById('copy').onclick=async()=>{try{const t=text();await navigator.clipboard.writeText(t);alert('コピーしました')}catch(e){out.textContent='ERROR: '+e.message}};</script></body></html>
