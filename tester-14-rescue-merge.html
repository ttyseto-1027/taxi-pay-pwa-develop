<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>テスター14件 安全復帰</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:16px;line-height:1.55;color:#17212b;background:#f7f9fa}h1{font-size:24px}.card{background:#fff;border:1px solid #ccd5da;border-radius:14px;padding:15px;margin:12px 0}.ok{border:2px solid #287a3d;background:#eefaf1}.warn{border:2px solid #9a5b00;background:#fff7e6}.bad{border:2px solid #a61b1b;background:#fff0f0}button{width:100%;min-height:54px;font-size:17px;font-weight:700;padding:12px;border-radius:12px;border:1px solid #8ca0aa;background:#fff;margin:8px 0}button:disabled{opacity:.45}.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 10px}.kv div:nth-child(odd){font-weight:700}.conflict{border:1px solid #c66;border-radius:10px;padding:12px;margin:12px 0;background:#fff}.choice{display:block;border:1px solid #bbb;border-radius:9px;padding:10px;margin:8px 0}.choice input{transform:scale(1.25);margin-right:8px}.detail{font-size:14px;margin-left:25px}.small{font-size:13px;color:#5d6870}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;background:#f1f4f5;padding:10px;border-radius:9px}</style></head><body><h1>テスター14件 安全復帰</h1><div class="card warn"><b>救出済み14件を現在の本番データへ非破壊統合します。</b><br>非競合データは不足分だけ追加します。競合がある場合は、現在のスマホ側と救出側を画面で比較し、本人が採用する方を選びます。選択完了まで書き込みません。Google Drive・DEVELOPには触れません。</div><div id="status" class="card">比較しています…</div><div id="summary" class="card" hidden></div><div id="conflicts" class="card warn" hidden></div><div id="actionBox" class="card" hidden><b>反映前の安全処理</b><br>現在の本番V10を端末内へ退避し、安全バックアップJSONも保存してから統合します。統合後に既存データ・救出データ・競合選択を自動検証し、異常時は元のV10へ自動ロールバックします。<button id="apply" disabled>選択内容で安全に統合する</button></div><div id="result" class="card" hidden></div><details class="card"><summary>技術確認情報</summary><pre id="tech"></pre></details><script>(()=>{'use strict';const KEY='taxiPayPwaStateV10',BACKUP_KEY='taxiPayTester14BeforeMergeV2';const RESCUE={initialized:true,settings:{shiftType:'隔日勤務',taxRate:10,fareRevisionCoefficient:1,payRevenueCoefficient:.9585,modelWorkAllowance:3000,accidentFreeAllowance:700,violationFreeAllowance:200,healthInsurance:0,pension:0,employmentInsurance:0,residentTax:25700,unionFee:7490,mutualAidFee:0,otherDeduction:85000,dependentCount:0,withholdingCategory:'A',paidLeaveDailyRate:0,paidLeaveOpeningBalance:13,paidLeaveNextGrantDate:'2027-04-04',paidLeaveNextGrantDays:20,paidLeaveAppliedGrants:[],paidLeaveUsageHistory:[],statutoryOvertimeRate:25,scheduledOvertimeRate:25,over60Rate:50,statutoryHolidayRate:35,nonStatutoryHolidayRate:25,nightRate:25},entries:[{id:'ebea5e57-8b4d-4cd5-82d1-f9b3031e9e33',date:'2026-07-30',paidLeaveUnits:0,grossRevenue:80650,clockIn:'09:27',clockOut:'02:27',normalBreakMinutes:140,nightBreakMinutes:0,holidayType:'normal',hadAccident:false,hadViolation:false},{id:'84a7597f-d718-4b53-a640-b2fbec0b65a0',date:'2026-07-25',paidLeaveUnits:0,grossRevenue:84050,clockIn:'07:29',clockOut:'01:29',normalBreakMinutes:130,nightBreakMinutes:0,holidayType:'normal',hadAccident:false,hadViolation:false},{id:'3cdff1c6-b91e-4e10-9825-64bc925f9983',date:'2026-07-23',paidLeaveUnits:0,grossRevenue:125000,clockIn:'10:32',clockOut:'04:30',normalBreakMinutes:100,nightBreakMinutes:25,holidayType:'normal',hadAccident:false,hadViolation:false},{id:'ca182bda-90bc-4ac4-a293-0dc37c7e0d38',date:'2026-07-19',paidLeaveUnits:2,grossRevenue:0,clockIn:'',clockOut:'',normalBreakMinutes:0,nightBreakMinutes:0,holidayType:'normal',hadAccident:false,hadViolation:false},{id:'55ff9056-d7b1-4989-90c7-e3cba5df5dfb',date:'2026-08-01',paidLeaveUnits:0,grossRevenue:36600,clockIn:'08:10',clockOut:'19:46',normalBreakMinutes:120,nightBreakMinutes:0,holidayType:'normal',hadAccident:false,hadViolation:false},{id:'e167cc60-d0da-4155-96e7-7563f7f1eff9',date:'2026-08-03',paidLeaveUnits:0,grossRevenue:109540,clockIn:'07:09',clockOut:'01:57',normalBreakMinutes:122,nightBreakMinutes:17,holidayType:'normal',hadAccident:false,hadViolation:false},{id:'902f0e53-f1cd-4dbb-a107-504b056cb1f2',date:'2026-08-06',paidLeaveUnits:0,grossRevenue:79500,clockIn:'09:49',clockOut:'03:34',normalBreakMinutes:85,nightBreakMinutes:37,holidayType:'normal',hadAccident:false,hadViolation:false},{id:'55504152-c9cf-4ae0-8862-5050042fa102',date:'2026-08-08',paidLeaveUnits:0,grossRevenue:106810,clockIn:'07:15',clockOut:'02:30',normalBreakMinutes:117,nightBreakMinutes:20,holidayType:'normal',hadAccident:false,hadViolation:false},{id:'c110fb12-81d9-47af-8385-dc640d1c76ca',date:'2026-08-11',paidLeaveUnits:0,grossRevenue:94960,clockIn:'06:43',clockOut:'00:27',normalBreakMinutes:99,nightBreakMinutes:39,holidayType:'normal',hadAccident:false,hadViolation:false},{id:'d853783c-1f8e-42b7-b40d-edc3e59a9125',date:'2026-08-13',paidLeaveUnits:0,grossRevenue:106140,clockIn:'09:51',clockOut:'04:05',normalBreakMinutes:110,nightBreakMinutes:38,holidayType:'normal',hadAccident:false,hadViolation:false},{id:'e5b5c629-25bd-4b7e-aebc-35943a857e3a',date:'2026-08-15',paidLeaveUnits:0,grossRevenue:84830,clockIn:'10:21',clockOut:'04:49',normalBreakMinutes:127,nightBreakMinutes:15,holidayType:'normal',hadAccident:false,hadViolation:false},{id:'cc9f95e8-be7f-4a16-a2ce-8a34ebcea19d',date:'2026-08-22',paidLeaveUnits:0,grossRevenue:65580,clockIn:'07:09',clockOut:'18:29',normalBreakMinutes:73,nightBreakMinutes:0,holidayType:'normal',hadAccident:false,hadViolation:false},{id:'b8023d09-c565-4b8e-b2e7-efebb3f649cf',date:'2026-08-23',paidLeaveUnits:1,grossRevenue:0,clockIn:'',clockOut:'',normalBreakMinutes:0,nightBreakMinutes:0,holidayType:'normal',hadAccident:false,hadViolation:false},{id:'bc01fba6-e2a8-4517-a4a4-21c0c648048a',date:'2026-08-25',paidLeaveUnits:0,grossRevenue:85890,clockIn:'07:34',clockOut:'03:24',normalBreakMinutes:75,nightBreakMinutes:57,holidayType:'normal',hadAccident:false,hadViolation:false}],history:[]};const $=id=>document.getElementById(id),clone=x=>JSON.parse(JSON.stringify(x));const parse=raw=>{try{return{ok:true,value:JSON.parse(raw)}}catch(e){return{ok:false,error:String(e)}}};const valid=s=>!!s&&typeof s==='object'&&!Array.isArray(s)&&Array.isArray(s.entries)&&Array.isArray(s.history)&&s.settings&&typeof s.settings==='object';const revenue=e=>Number(e?.grossRevenue??e?.adjustedGrossSales??e?.grossSales??0);const canon=e=>JSON.stringify({date:e?.date||'',paidLeaveUnits:Number(e?.paidLeaveUnits||0),grossRevenue:revenue(e),clockIn:e?.clockIn||'',clockOut:e?.clockOut||'',normalBreakMinutes:Number(e?.normalBreakMinutes||0),nightBreakMinutes:Number(e?.nightBreakMinutes||0),holidayType:e?.holidayType||'normal',hadAccident:!!e?.hadAccident,hadViolation:!!e?.hadViolation});const detail=e=>'営収 '+revenue(e).toLocaleString('ja-JP')+'円 / 有休 '+Number(e?.paidLeaveUnits||0)+' / 出 '+(e?.clockIn||'―')+' / 帰 '+(e?.clockOut||'―')+' / 通常休憩 '+Number(e?.normalBreakMinutes||0)+'分 / 深夜休憩 '+Number(e?.nightBreakMinutes||0)+'分';function compare(current){const byId=new Map(current.entries.map(e=>[e.id,e])),byDate=new Map();current.entries.forEach(e=>{if(!byDate.has(e.date))byDate.set(e.date,[]);byDate.get(e.date).push(e)});const add=[],same=[],conflicts=[];for(const r of RESCUE.entries){const ih=byId.get(r.id);if(ih){if(canon(ih)===canon(r))same.push(r);else conflicts.push({date:r.date,rescue:r,current:[ih],reason:'同一IDで内容相違'});continue}const ds=byDate.get(r.date)||[],sem=ds.find(e=>canon(e)===canon(r));if(sem){same.push(r);continue}if(ds.length){conflicts.push({date:r.date,rescue:r,current:ds,reason:'同じ日付に異なる内容'});continue}add.push(r)}return{add,same,conflicts}}function dl(name,obj){const b=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}let beforeRaw,current,cmp;try{beforeRaw=localStorage.getItem(KEY)}catch(e){$('status').className='card bad';$('status').textContent='本番データを読み取れません。何も変更していません。';return}if(beforeRaw===null){current=clone(RESCUE);current.entries=[];current.history=[]}else{const p=parse(beforeRaw);if(!p.ok||!valid(p.value)){$('status').className='card bad';$('status').textContent='現在の本番V10を安全に解析できません。何も変更していません。';return}current=p.value}cmp=compare(current);$('summary').hidden=false;$('summary').innerHTML='<div class="kv"><div>現在の本番</div><div>'+current.entries.length+'件</div><div>救出済み</div><div>14件</div><div>一致済み</div><div>'+cmp.same.length+'件</div><div>自動追加</div><div>'+cmp.add.length+'件</div><div>要確認</div><div>'+cmp.conflicts.length+'件</div></div>';const choices=new Map();function refresh(){const ready=cmp.conflicts.every((_,i)=>choices.has(i));$('apply').disabled=!ready;$('status').className='card '+(ready?'ok':'warn');$('status').innerHTML=ready?'<b>統合準備ができました。</b><br>反映するまで本番データは変更されません。':'<b>競合データを本人が確認してください。</b><br>全て選択するまで本番データは変更されません。'}if(cmp.conflicts.length){$('conflicts').hidden=false;$('conflicts').innerHTML='<b>同じ日付で内容が異なるデータ</b><div class="small">実際に入力した内容を確認し、日付ごとに採用する方を選んでください。</div>'+cmp.conflicts.map((c,i)=>'<div class="conflict"><b>'+c.date+'</b><label class="choice"><input type="radio" name="c'+i+'" value="current">現在のスマホ側を残す<div class="detail">'+c.current.map(detail).join('<br>')+'</div></label><label class="choice"><input type="radio" name="c'+i+'" value="rescue">救出データを採用<div class="detail">'+detail(c.rescue)+'</div></label></div>').join('');cmp.conflicts.forEach((_,i)=>document.querySelectorAll('input[name="c'+i+'"]').forEach(r=>r.onchange=()=>{choices.set(i,r.value);refresh()}))}$('actionBox').hidden=false;refresh();$('tech').textContent=JSON.stringify({mode:'SAFE_MERGE_WITH_USER_CONFLICT_RESOLUTION',currentEntries:current.entries.length,rescueEntries:14,same:cmp.same.map(e=>e.date),autoAdd:cmp.add.map(e=>e.date),conflicts:cmp.conflicts.map(c=>({date:c.date,reason:c.reason}))},null,2);$('apply').onclick=()=>{let wrote=false;try{if(!cmp.conflicts.every((_,i)=>choices.has(i)))throw new Error('競合の選択が完了していません');const stamp=new Date().toISOString(),backup={backupFormat:'taxi-pay-tester14-before-merge-v2',createdAt:stamp,key:KEY,state:beforeRaw===null?null:clone(current)};localStorage.setItem(BACKUP_KEY,JSON.stringify(backup));if(localStorage.getItem(BACKUP_KEY)!==JSON.stringify(backup))throw new Error('端末内バックアップ検証失敗');dl('taxi-pay-before-tester14-merge-'+stamp.replace(/[:.]/g,'-')+'.json',backup);const merged=clone(current);if(beforeRaw===null)merged.settings=clone(RESCUE.settings);merged.initialized=true;merged.entries=current.entries.map(clone);const removeCurrentForConflict=new Set();cmp.conflicts.forEach((c,i)=>{if(choices.get(i)==='rescue')c.current.forEach(x=>removeCurrentForConflict.add(x.id))});merged.entries=merged.entries.filter(e=>!removeCurrentForConflict.has(e.id));cmp.add.forEach(e=>merged.entries.push(clone(e)));cmp.conflicts.forEach((c,i)=>{if(choices.get(i)==='rescue')merged.entries.push(clone(c.rescue))});const expectedCurrent=current.entries.filter(e=>!removeCurrentForConflict.has(e.id)).map(canon),expectedRescue=[...cmp.same,...cmp.add,...cmp.conflicts.filter((_,i)=>choices.get(i)==='rescue').map(c=>c.rescue)].map(canon);localStorage.setItem(KEY,JSON.stringify(merged));wrote=true;const vp=parse(localStorage.getItem(KEY));if(!vp.ok||!valid(vp.value))throw new Error('統合後V10再解析失敗');const vc=vp.value.entries.map(canon);if(!expectedCurrent.every(x=>vc.includes(x)))throw new Error('残すべき現在データが欠落');if(!expectedRescue.every(x=>vc.includes(x)))throw new Error('採用した救出データが欠落');const dates=new Map();for(const e of vp.value.entries){if(!dates.has(e.date))dates.set(e.date,[]);dates.get(e.date).push(e)}for(const [i,c] of cmp.conflicts.entries()){const arr=dates.get(c.date)||[];if(choices.get(i)==='rescue'&&!arr.some(e=>canon(e)===canon(c.rescue)))throw new Error(c.date+'の救出選択検証失敗');if(choices.get(i)==='current'&&!c.current.every(x=>arr.some(e=>canon(e)===canon(x))))throw new Error(c.date+'の現在側選択検証失敗')}$('result').hidden=false;$('result').className='card ok';$('result').innerHTML='<b>安全統合に成功しました。</b><br>統合後 '+vp.value.entries.length+'件です。既存データ・自動追加・本人選択の競合データを検証済みです。<button id="open">本番アプリを開いて確認</button>';$('open').onclick=()=>location.href='https://ttyseto-1027.github.io/taxi-pay-pwa/';$('apply').disabled=true;$('tech').textContent=JSON.stringify({status:'SUCCESS',mergedEntries:vp.value.entries.length,choices:[...choices.entries()].map(([i,v])=>({date:cmp.conflicts[i].date,choice:v}))},null,2)}catch(e){try{if(wrote){if(beforeRaw===null)localStorage.removeItem(KEY);else localStorage.setItem(KEY,beforeRaw)}}catch{}$('result').hidden=false;$('result').className='card bad';$('result').textContent='統合に失敗しました。元の本番データへ戻しました。 '+e.message}}}})();</script></body></html>
