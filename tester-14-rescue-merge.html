<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>テスター14件 非破壊復帰</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:16px;line-height:1.6;color:#17212b;background:#f7f9fa}h1{font-size:25px}.card{background:#fff;border:1px solid #ccd5da;border-radius:14px;padding:16px;margin:12px 0}.ok{border:2px solid #287a3d;background:#eefaf1}.warn{border:2px solid #9a5b00;background:#fff7e6}.bad{border:2px solid #a61b1b;background:#fff0f0}button{width:100%;min-height:54px;font-size:17px;font-weight:700;padding:12px 14px;border-radius:12px;border:1px solid #8ca0aa;background:#fff;margin:8px 0}button:disabled{opacity:.45}.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 12px}.kv div:nth-child(odd){font-weight:700}.small{font-size:13px;color:#5d6870}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;background:#f1f4f5;padding:12px;border-radius:10px}.conflict{padding:10px;border:1px solid #c66;border-radius:9px;margin:8px 0;background:#fff}.date{font-weight:700}
</style>
</head>
<body>
<h1>テスター14件 非破壊復帰</h1>
<div class="card warn"><b>救出済み14件を、現在の本番データを消さずに統合します。</b><br>現在のデータは必ず残し、救出側にしかない勤務実績だけを追加します。同じ日付で内容が異なる場合は自動停止し、書き込みません。Google Drive・DEVELOPには触れません。</div>
<div id="status" class="card">現在の本番データと救出済み14件を比較しています…</div>
<div id="summary" class="card" hidden></div>
<div id="conflicts" class="card bad" hidden></div>
<div id="actionBox" class="card" hidden>
  <b>安全バックアップについて</b><br>反映ボタンを押すと、書き込み前に現在の本番V10を端末内へ退避し、さらにJSONファイルとしてスマホへ保存します。その後にだけ統合を書き込みます。検証に失敗した場合は元のV10へ自動で戻します。
  <button id="apply" disabled>現在データを保存して14件を安全統合</button>
</div>
<div id="result" class="card" hidden></div>
<details class="card"><summary>技術確認情報</summary><pre id="tech"></pre></details>
<script>
(()=>{'use strict';
const KEY='taxiPayPwaStateV10';
const BACKUP_KEY='taxiPayTester14BeforeMergeV1';
const RESCUE={
 initialized:true,
 settings:{shiftType:'隔日勤務',taxRate:10,fareRevisionCoefficient:1,payRevenueCoefficient:.9585,modelWorkAllowance:3000,accidentFreeAllowance:700,violationFreeAllowance:200,healthInsurance:0,pension:0,employmentInsurance:0,residentTax:25700,unionFee:7490,mutualAidFee:0,otherDeduction:85000,dependentCount:0,withholdingCategory:'A',paidLeaveDailyRate:0,paidLeaveOpeningBalance:13,paidLeaveNextGrantDate:'2027-04-04',paidLeaveNextGrantDays:20,paidLeaveAppliedGrants:[],paidLeaveUsageHistory:[],statutoryOvertimeRate:25,scheduledOvertimeRate:25,over60Rate:50,statutoryHolidayRate:35,nonStatutoryHolidayRate:25,nightRate:25},
 entries:[
  {id:'ebea5e57-8b4d-4cd5-82d1-f9b3031e9e33',date:'2026-07-30',paidLeaveUnits:0,grossRevenue:80650,clockIn:'09:27',clockOut:'02:27',normalBreakMinutes:140,nightBreakMinutes:0,holidayType:'normal',hadAccident:false,hadViolation:false},
  {id:'84a7597f-d718-4b53-a640-b2fbec0b65a0',date:'2026-07-25',paidLeaveUnits:0,grossRevenue:84050,clockIn:'07:29',clockOut:'01:29',normalBreakMinutes:130,nightBreakMinutes:0,holidayType:'normal',hadAccident:false,hadViolation:false},
  {id:'3cdff1c6-b91e-4e10-9825-64bc925f9983',date:'2026-07-23',paidLeaveUnits:0,grossRevenue:125000,clockIn:'10:32',clockOut:'04:30',normalBreakMinutes:100,nightBreakMinutes:25,holidayType:'normal',hadAccident:false,hadViolation:false},
  {id:'ca182bda-90bc-4ac4-a293-0dc37c7e0d38',date:'2026-07-19',paidLeaveUnits:2,grossRevenue:0,clockIn:'',clockOut:'',normalBreakMinutes:0,nightBreakMinutes:0,holidayType:'normal',hadAccident:false,hadViolation:false},
  {id:'55ff9056-d7b1-4989-90c7-e3cba5df5dfb',date:'2026-08-01',paidLeaveUnits:0,grossRevenue:36600,clockIn:'08:10',clockOut:'19:46',normalBreakMinutes:120,nightBreakMinutes:0,holidayType:'normal',hadAccident:false,hadViolation:false},
  {id:'e167cc60-d0da-4155-96e7-7563f7f1eff9',date:'2026-08-03',paidLeaveUnits:0,grossRevenue:109540,clockIn:'07:09',clockOut:'01:57',normalBreakMinutes:122,nightBreakMinutes:17,holidayType:'normal',hadAccident:false,hadViolation:false},
  {id:'902f0e53-f1cd-4dbb-a107-504b056cb1f2',date:'2026-08-06',paidLeaveUnits:0,grossRevenue:79500,clockIn:'09:49',clockOut:'03:34',normalBreakMinutes:85,nightBreakMinutes:37,holidayType:'normal',hadAccident:false,hadViolation:false},
  {id:'55504152-c9cf-4ae0-8862-5050042fa102',date:'2026-08-08',paidLeaveUnits:0,grossRevenue:106810,clockIn:'07:15',clockOut:'02:30',normalBreakMinutes:117,nightBreakMinutes:20,holidayType:'normal',hadAccident:false,hadViolation:false},
  {id:'c110fb12-81d9-47af-8385-dc640d1c76ca',date:'2026-08-11',paidLeaveUnits:0,grossRevenue:94960,clockIn:'06:43',clockOut:'00:27',normalBreakMinutes:99,nightBreakMinutes:39,holidayType:'normal',hadAccident:false,hadViolation:false},
  {id:'d853783c-1f8e-42b7-b40d-edc3e59a9125',date:'2026-08-13',paidLeaveUnits:0,grossRevenue:106140,clockIn:'09:51',clockOut:'04:05',normalBreakMinutes:110,nightBreakMinutes:38,holidayType:'normal',hadAccident:false,hadViolation:false},
  {id:'e5b5c629-25bd-4b7e-aebc-35943a857e3a',date:'2026-08-15',paidLeaveUnits:0,grossRevenue:84830,clockIn:'10:21',clockOut:'04:49',normalBreakMinutes:127,nightBreakMinutes:15,holidayType:'normal',hadAccident:false,hadViolation:false},
  {id:'cc9f95e8-be7f-4a16-a2ce-8a34ebcea19d',date:'2026-08-22',paidLeaveUnits:0,grossRevenue:65580,clockIn:'07:09',clockOut:'18:29',normalBreakMinutes:73,nightBreakMinutes:0,holidayType:'normal',hadAccident:false,hadViolation:false},
  {id:'b8023d09-c565-4b8e-b2e7-efebb3f649cf',date:'2026-08-23',paidLeaveUnits:1,grossRevenue:0,clockIn:'',clockOut:'',normalBreakMinutes:0,nightBreakMinutes:0,holidayType:'normal',hadAccident:false,hadViolation:false},
  {id:'bc01fba6-e2a8-4517-a4a4-21c0c648048a',date:'2026-08-25',paidLeaveUnits:0,grossRevenue:85890,clockIn:'07:34',clockOut:'03:24',normalBreakMinutes:75,nightBreakMinutes:57,holidayType:'normal',hadAccident:false,hadViolation:false}
 ],history:[]
};
const $=id=>document.getElementById(id);
const clone=x=>JSON.parse(JSON.stringify(x));
const parse=raw=>{try{return{ok:true,value:JSON.parse(raw)}}catch(e){return{ok:false,error:String(e)}}};
const valid=s=>!!s&&typeof s==='object'&&!Array.isArray(s)&&Array.isArray(s.entries)&&Array.isArray(s.history)&&s.settings&&typeof s.settings==='object';
const revenue=e=>Number(e?.grossRevenue??e?.adjustedGrossSales??e?.grossSales??0);
const canon=e=>JSON.stringify({date:e?.date||'',paidLeaveUnits:Number(e?.paidLeaveUnits||0),grossRevenue:revenue(e),clockIn:e?.clockIn||'',clockOut:e?.clockOut||'',normalBreakMinutes:Number(e?.normalBreakMinutes||0),nightBreakMinutes:Number(e?.nightBreakMinutes||0),holidayType:e?.holidayType||'normal',hadAccident:!!e?.hadAccident,hadViolation:!!e?.hadViolation});
function summary(s){return{entries:s.entries.length,history:s.history.length,dates:s.entries.map(e=>e.date).filter(Boolean).sort()}}
function compare(current){
 const byId=new Map(current.entries.map(e=>[e.id,e]));
 const byDate=new Map(); current.entries.forEach(e=>{if(!byDate.has(e.date))byDate.set(e.date,[]);byDate.get(e.date).push(e)});
 const add=[],same=[],conflicts=[];
 for(const r of RESCUE.entries){
   const idHit=byId.get(r.id);
   if(idHit){ if(canon(idHit)===canon(r)) same.push(r); else conflicts.push({date:r.date,reason:'同一IDで内容相違',rescue:r,current:idHit}); continue; }
   const ds=byDate.get(r.date)||[];
   const semantic=ds.find(e=>canon(e)===canon(r));
   if(semantic){same.push(r);continue;}
   if(ds.length){conflicts.push({date:r.date,reason:'同じ日付に異なる内容',rescue:r,current:ds});continue;}
   add.push(r);
 }
 return{add,same,conflicts};
}
function dl(name,obj){const text=JSON.stringify(obj,null,2),b=new Blob([text],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);return text.length}
let beforeRaw=null,current=null,cmp=null;
try{beforeRaw=localStorage.getItem(KEY)}catch(e){$('status').className='card bad';$('status').textContent='本番データを読み取れません。何も変更していません。';$('tech').textContent=String(e);return}
if(beforeRaw===null){current=clone(RESCUE);current.entries=[];current.history=[];}else{const p=parse(beforeRaw);if(!p.ok||!valid(p.value)){$('status').className='card bad';$('status').textContent='現在の本番V10を安全に解析できません。何も変更していません。';$('tech').textContent=JSON.stringify({exists:true,json:p.ok,error:p.error||null},null,2);return}current=p.value;}
cmp=compare(current);
const cur=summary(current);
$('summary').hidden=false;$('summary').innerHTML='<div class="kv"><div>現在の本番</div><div>'+cur.entries+'件</div><div>救出済み</div><div>14件</div><div>そのまま残る既存</div><div>'+cmp.same.length+'件</div><div>追加予定</div><div>'+cmp.add.length+'件</div><div>競合</div><div>'+cmp.conflicts.length+'件</div><div>統合後予定</div><div>'+(cur.entries+cmp.add.length)+'件</div></div>';
if(cmp.conflicts.length){$('status').className='card bad';$('status').innerHTML='<b>競合を検出したため自動統合を停止しました。</b><br>現在の本番データには一切書き込んでいません。';$('conflicts').hidden=false;$('conflicts').innerHTML='<b>競合日</b>'+cmp.conflicts.map(c=>'<div class="conflict"><span class="date">'+c.date+'</span>：'+c.reason+'<br>救出側営収 '+revenue(c.rescue).toLocaleString('ja-JP')+'円 / 現在側営収 '+(Array.isArray(c.current)?c.current.map(x=>revenue(x).toLocaleString('ja-JP')).join('・'):revenue(c.current).toLocaleString('ja-JP'))+'円</div>').join('');}
else{$('status').className='card ok';$('status').innerHTML='<b>非破壊で統合できます。</b><br>現在側だけのデータは残し、救出側の不足分 '+cmp.add.length+'件だけを追加します。';$('actionBox').hidden=false;$('apply').disabled=false;}
$('tech').textContent=JSON.stringify({mode:'NON_DESTRUCTIVE_MERGE_PREVIEW',key:KEY,current:cur,rescueEntries:14,same:cmp.same.map(e=>e.date),add:cmp.add.map(e=>e.date),conflicts:cmp.conflicts.map(c=>({date:c.date,reason:c.reason}))},null,2);
$('apply').onclick=()=>{let wrote=false;try{
 const stamp=new Date().toISOString();
 const backupPack={backupFormat:'taxi-pay-tester14-before-merge-v1',createdAt:stamp,key:KEY,rawState:beforeRaw===null?null:current};
 localStorage.setItem(BACKUP_KEY,JSON.stringify(backupPack));
 if(localStorage.getItem(BACKUP_KEY)!==JSON.stringify(backupPack))throw new Error('端末内バックアップ検証に失敗しました');
 dl('taxi-pay-before-tester14-merge-'+stamp.replace(/[:.]/g,'-')+'.json',backupPack);
 const merged=clone(current); merged.initialized=true; merged.entries=[...current.entries.map(clone),...cmp.add.map(clone)];
 if(beforeRaw===null) merged.settings=clone(RESCUE.settings);
 const oldCanons=current.entries.map(canon);
 const rescueCanons=RESCUE.entries.map(canon);
 localStorage.setItem(KEY,JSON.stringify(merged)); wrote=true;
 const verifyRaw=localStorage.getItem(KEY),vp=parse(verifyRaw);
 if(!vp.ok||!valid(vp.value))throw new Error('統合後V10の再解析に失敗しました');
 const vs=vp.value;
 const vcan=vs.entries.map(canon);
 if(!oldCanons.every(x=>vcan.includes(x)))throw new Error('現在側の既存勤務実績が1件以上失われました');
 if(!rescueCanons.every(x=>vcan.includes(x)))throw new Error('救出14件のうち1件以上が反映されていません');
 if(vs.entries.length!==current.entries.length+cmp.add.length)throw new Error('統合後件数が予定と一致しません');
 $('result').hidden=false;$('result').className='card ok';$('result').innerHTML='<b>14件の非破壊復帰に成功しました。</b><br>現在側の既存データを保持したまま、不足していた '+cmp.add.length+'件を追加しました。統合後は '+vs.entries.length+'件です。<br><button id="openProd">本番アプリを開いて確認</button>';
 $('apply').disabled=true;
 $('tech').textContent=JSON.stringify({status:'MERGE_SUCCESS',backupKey:BACKUP_KEY,currentEntriesPreserved:true,rescue14Present:true,added:cmp.add.map(e=>e.date),entriesAfter:vs.entries.length},null,2);
 document.getElementById('openProd').onclick=()=>location.href='https://ttyseto-1027.github.io/taxi-pay-pwa/';
 }catch(e){try{if(wrote){if(beforeRaw===null)localStorage.removeItem(KEY);else localStorage.setItem(KEY,beforeRaw)}}catch(_){}$('result').hidden=false;$('result').className='card bad';$('result').innerHTML='<b>統合を中止しました。</b><br>'+String(e.message||e)+'<br>本番V10は反映前の状態へ戻しました。';$('tech').textContent=JSON.stringify({status:'MERGE_FAILED_ROLLED_BACK',error:String(e)},null,2);}}
})();
</script>
</body>
</html>
