<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Drive統合プレビュー</title><style>body{font-family:system-ui;margin:18px;color:#17212b;line-height:1.55}button{font-size:16px;padding:12px;margin:8px 8px 8px 0}.note{padding:12px;border:2px solid #0f5968;border-radius:10px}.warn{padding:12px;border:2px solid #9a5b00;border-radius:10px;background:#fff7e6}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;background:#f5f7f8;padding:12px;border-radius:8px}</style><script src="firebase-config.js"></script></head><body><h1>Google Drive 統合プレビュー（読取専用）</h1><p class="note">このページは端末データとGoogle Driveの current.json を読み取り、統合した場合の結果だけを表示します。端末・Driveともに書き込み、削除、復元、バックアップは一切行いません。</p><p class="warn">まだ本番データは変更しません。「Googleログインして統合プレビュー」を押してください。</p><button id="run" type="button">Googleログインして統合プレビュー</button><button id="copy" type="button">結果をコピー</button><pre id="out">準備中...</pre><script type="module">import{initializeApp,getApps}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';import{getAuth,GoogleAuthProvider,signInWithPopup}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';const out=document.getElementById('out'),run=document.getElementById('run'),copy=document.getElementById('copy');let auth;function report(x){out.textContent=JSON.stringify(x,null,2)}function stateSummary(s){const e=Array.isArray(s?.entries)?s.entries:[],h=Array.isArray(s?.history)?s.history:[];return{entries:e.length,history:h.length,dates:e.map(x=>x?.date).filter(Boolean).sort()}}function stable(x){if(!x||typeof x!=='object')return JSON.stringify(x);const y={...x};delete y.id;return JSON.stringify(y,Object.keys(y).sort())}function entryKey(x){return String(x?.id||'')}function mergeEntries(local,remote){const l=Array.isArray(local)?local:[],r=Array.isArray(remote)?remote:[];const merged=[],conflicts=[],seen=new Map();for(const item of [...r,...l]){const id=entryKey(item);const date=String(item?.date||'');if(id&&seen.has('id:'+id)){const prev=seen.get('id:'+id);if(stable(prev)!==stable(item))conflicts.push({type:'same-id-different-content',id,date,remoteOrEarlier:prev,localOrLater:item});continue}const sameDate=merged.find(x=>date&&String(x?.date||'')===date);if(sameDate&&(!id||String(sameDate?.id||'')!==id)){if(stable(sameDate)!==stable(item))conflicts.push({type:'same-date-different-record',date,first:sameDate,second:item});continue}merged.push(item);if(id)seen.set('id:'+id,item)}merged.sort((a,b)=>String(a?.date||'').localeCompare(String(b?.date||'')));return{merged,conflicts}}async function driveJson(token){const q=encodeURIComponent("name='current.json' and trashed=false");const list=await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name,modifiedTime)&orderBy=modifiedTime%20desc&pageSize=10`,{headers:{Authorization:`Bearer ${token}`}});if(!list.ok)throw new Error('current.json の検索に失敗しました ('+list.status+')');const j=await list.json();const f=j.files?.[0];if(!f)throw new Error('Google Driveに current.json が見つかりません。');const res=await fetch(`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(f.id)}?alt=media`,{headers:{Authorization:`Bearer ${token}`}});if(!res.ok)throw new Error('current.json の読取に失敗しました ('+res.status+')');return{file:f,payload:await res.json()}}try{const cfg=window.TAXI_PAY_FIREBASE_CONFIG||{};if(!cfg.apiKey)throw new Error('Firebase config missing');auth=getAuth(getApps().length?getApps()[0]:initializeApp(cfg));report({status:'ready',message:'書き込みは行いません。'});}catch(e){report({status:'init-error',message:String(e?.message||e)})}run.onclick=async()=>{run.disabled=true;try{const raw=localStorage.getItem('taxiPayPwaStateV10');if(!raw)throw new Error('この端末に taxiPayPwaStateV10 がありません。');const local=JSON.parse(raw);const provider=new GoogleAuthProvider();provider.addScope('https://www.googleapis.com/auth/drive.file');provider.setCustomParameters({prompt:'consent'});const result=await signInWithPopup(auth,provider);const token=GoogleAuthProvider.credentialFromResult(result)?.accessToken||'';if(!token)throw new Error('Driveアクセストークンを取得できませんでした。');const remoteInfo=await driveJson(token);const remote=remoteInfo.payload?.data?.state;if(!remote||!Array.isArray(remote.entries))throw new Error('current.json の給与データ形式を確認できません。');const m=mergeEntries(local.entries,remote.entries);const localIds=new Set((local.entries||[]).map(entryKey));const remoteIds=new Set((remote.entries||[]).map(entryKey));const onlyLocal=m.merged.filter(x=>entryKey(x)&&!remoteIds.has(entryKey(x))).map(x=>({date:x.date,id:x.id}));const onlyDrive=m.merged.filter(x=>entryKey(x)&&!localIds.has(entryKey(x))).map(x=>({date:x.date,id:x.id}));report({generatedAt:new Date().toISOString(),userAgent:navigator.userAgent,mode:'READ_ONLY_NO_WRITES',local:stateSummary(local),drive:{...stateSummary(remote),savedAtJst:remoteInfo.payload?.savedAtJst||null,deviceName:remoteInfo.payload?.deviceName||null,currentModifiedTime:remoteInfo.file.modifiedTime||null},mergePreview:{entriesAfterMerge:m.merged.length,onlyLocal,onlyDrive,conflictCount:m.conflicts.length,conflicts:m.conflicts.map(c=>({type:c.type,date:c.date||'',id:c.id||''})),mergedDates:m.merged.map(x=>x.date)},safeToAutoMerge:m.conflicts.length===0,note:'この結果はプレビューだけです。端末・Driveへ書き込んでいません。'});}catch(e){report({generatedAt:new Date().toISOString(),mode:'READ_ONLY_NO_WRITES',status:'error',code:e?.code||'',message:String(e?.message||e)});}finally{run.disabled=false}};copy.onclick=async()=>{try{await navigator.clipboard.writeText(out.textContent);alert('コピーしました')}catch{window.prompt('結果をコピーしてください。',out.textContent)}};</script></body></html>
