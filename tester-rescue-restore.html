<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>テスター データ救出</title><style>body{font-family:system-ui;margin:18px;color:#17212b;line-height:1.6}.box{padding:14px;border:2px solid #0f5968;border-radius:10px;margin:12px 0}.warn{border-color:#9a5b00;background:#fff7e6}.ok{border-color:#287a3d;background:#eefaf1}.bad{border-color:#a61b1b;background:#fff0f0}button{font-size:16px;padding:12px 16px;margin:8px 8px 8px 0}button:disabled{opacity:.45}code{overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;background:#f5f7f8;padding:10px;border-radius:8px}</style></head><body><h1>テスター データ救出</h1><div class="box warn"><b>このページは、診断で救出可能と確認できた端末だけで使用します。</b><br>本番キー <code>taxiPayPwaStateV10</code> は変更・削除しません。救出先のDEVELOPキーを書き換える前に、現在値を別キーへ退避し、書込み後に完全一致を検証します。</div><div id="status" class="box">確認中...</div><button id="exportBtn" disabled>救出元データをファイル保存</button><button id="restoreBtn" disabled>救出を実行</button><div id="result"></div><details><summary>確認内容</summary><pre id="details"></pre></details><script>"use strict";(()=>{const PROD='taxiPayPwaStateV10',DEV='taxiPayPwaDevelopStateV10',MANUAL_BACKUP='taxiPayManualRescueBackupV1',DIAG='taxiPayManualRescueDiagnosticsV1';const $=id=>document.getElementById(id);function parse(raw){try{return{ok:true,value:JSON.parse(raw)}}catch(e){return{ok:false,error:String(e)}}}function count(v){return(Number(Array.isArray(v?.entries)?v.entries.length:0)||0)+(Number(Array.isArray(v?.history)?v.history.length:0)||0)}function log(event,detail={}){try{const old=parse(localStorage.getItem(DIAG)||'[]');const rows=old.ok&&Array.isArray(old.value)?old.value:[];rows.push({at:new Date().toISOString(),event,...detail});localStorage.setItem(DIAG,JSON.stringify(rows.slice(-20)))}catch{}}let prodRaw=null,prod=null,devRaw=null,ready=false;try{prodRaw=localStorage.getItem(PROD);devRaw=localStorage.getItem(DEV)}catch(e){$('status').className='box bad';$('status').textContent='localStorageを読み取れません: '+e;return}const pp=parse(prodRaw),dp=devRaw===null?{ok:true,value:null}:parse(devRaw);const prodCount=pp.ok?count(pp.value):0,devCount=dp.ok&&dp.value?count(dp.value):0;const info={origin:location.origin,userAgent:navigator.userAgent,prod:{exists:prodRaw!==null,valid:pp.ok,entries:pp.ok&&Array.isArray(pp.value?.entries)?pp.value.entries.length:null,history:pp.ok&&Array.isArray(pp.value?.history)?pp.value.history.length:null,length:prodRaw?.length||0},dev:{exists:devRaw!==null,valid:dp.ok,entries:dp.ok&&Array.isArray(dp.value?.entries)?dp.value.entries.length:null,history:dp.ok&&Array.isArray(dp.value?.history)?dp.value.history.length:null,length:devRaw?.length||0}};$('details').textContent=JSON.stringify(info,null,2);if(!prodRaw||!pp.ok||prodCount<=0){$('status').className='box bad';$('status').innerHTML='<b>救出を実行できません。</b><br>本番キーに有効な勤務実績・締め履歴がありません。';return}prod=pp.value;ready=true;$('exportBtn').disabled=false;$('restoreBtn').disabled=false;$('status').className='box ok';$('status').innerHTML=`<b>救出元を確認しました。</b><br>本番V10：entries=${info.prod.entries} / history=${info.prod.history}<br>現在のDEVELOP V10：entries=${info.dev.entries??'—'} / history=${info.dev.history??'—'}<br>本番V10はこの処理では変更しません。`;$('exportBtn').onclick=()=>{if(!ready)return;const blob=new Blob([prodRaw],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='taxi-pay-rescue-'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);log('source-exported',{entries:info.prod.entries,history:info.prod.history})};$('restoreBtn').onclick=()=>{if(!ready)return;if(!confirm(`本番V10のデータ（entries=${info.prod.entries} / history=${info.prod.history}）をDEVELOP V10へ救出します。\n本番V10は変更しません。続けますか？`))return;try{const backup={at:new Date().toISOString(),targetKey:DEV,previousRaw:devRaw};localStorage.setItem(MANUAL_BACKUP,JSON.stringify(backup));const backupCheck=localStorage.getItem(MANUAL_BACKUP);if(backupCheck!==JSON.stringify(backup))throw new Error('救出前バックアップの照合に失敗しました');localStorage.setItem(DEV,prodRaw);const written=localStorage.getItem(DEV);if(written!==prodRaw)throw new Error('救出後データの完全一致照合に失敗しました');const wp=parse(written);if(!wp.ok||count(wp.value)!==prodCount)throw new Error('救出後データ件数の検証に失敗しました');log('restore-success',{sourceKey:PROD,targetKey:DEV,entries:Array.isArray(wp.value.entries)?wp.value.entries.length:null,history:Array.isArray(wp.value.history)?wp.value.history.length:null,sourceLength:prodRaw.length});$('result').className='box ok';$('result').innerHTML=`<b>救出成功。</b><br>DEVELOP V10へ完全一致で保存し、件数検証も成功しました。<br>entries=${Array.isArray(wp.value.entries)?wp.value.entries.length:0} / history=${Array.isArray(wp.value.history)?wp.value.history.length:0}<br><b>この画面を閉じる前に、この結果を管理者へ伝えてください。</b>`;$('restoreBtn').disabled=true}catch(e){log('restore-failed',{message:String(e)});$('result').className='box bad';$('result').innerHTML='<b>救出を中止しました。</b><br>'+String(e)+'<br>給与シミュレーター本体は開かず、この画面を管理者へ送ってください。'}}})();</script></body></html>
