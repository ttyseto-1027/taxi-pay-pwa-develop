<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>テスター本番データ救出</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:16px;line-height:1.6;color:#17212b;background:#f7f9fa}
h1{font-size:26px;margin:8px 0 16px}.card{background:#fff;border:1px solid #ccd5da;border-radius:14px;padding:16px;margin:12px 0}.ok{border:2px solid #287a3d;background:#eefaf1}.warn{border:2px solid #9a5b00;background:#fff7e6}.bad{border:2px solid #a61b1b;background:#fff0f0}button{width:100%;min-height:54px;font-size:18px;font-weight:700;padding:12px 16px;border-radius:12px;border:1px solid #8ca0aa;background:#fff;margin:8px 0}button:disabled{opacity:.45}.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 12px}.kv div:nth-child(odd){font-weight:700}.small{font-size:13px;color:#5d6870}code{overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;background:#f1f4f5;padding:12px;border-radius:10px}
</style>
</head>
<body>
<h1>テスター本番データ救出</h1>
<div class="card warn"><b>このページは救出専用・読取専用です。</b><br>本番データを読み取ってJSONファイルとして保存するだけです。<br><b>本番データの変更・削除・復帰、DEVELOPデータの操作、Google Driveへの接続・書込みは一切行いません。</b></div>
<div id="status" class="card">本番データを確認しています…</div>
<div id="summary" class="card" hidden></div>
<button id="save" disabled>救出JSONをスマホに保存</button>
<div id="result" class="card" hidden></div>
<div class="card"><b>救出後</b><br>保存完了後も元の本番データはスマホ内に残ります。管理者が救出JSONの内容を確認するまで、復帰・削除などの操作は行わないでください。</div>
<details class="card"><summary>技術確認情報</summary><pre id="tech"></pre></details>
<script>
(()=>{'use strict';
const KEY='taxiPayPwaStateV10';
const $=id=>document.getElementById(id);
function parse(raw){try{return{ok:true,value:JSON.parse(raw)}}catch(e){return{ok:false,error:String(e)}}}
function validState(s){return !!s&&typeof s==='object'&&!Array.isArray(s)&&Array.isArray(s.entries)&&Array.isArray(s.history)&&s.settings&&typeof s.settings==='object'}
function summaryOf(s){return{entries:s.entries.length,history:s.history.length,dates:s.entries.map(x=>x&&x.date).filter(Boolean).sort(),gross:s.entries.reduce((a,x)=>a+Number(x?.grossRevenue??x?.adjustedGrossSales??0),0)}}
let raw=null,state=null,summary=null;
try{raw=localStorage.getItem(KEY)}catch(e){$('status').className='card bad';$('status').textContent='本番データを読み取れませんでした。管理者へこの画面を送ってください。';$('tech').textContent=String(e);return}
if(raw===null){$('status').className='card bad';$('status').textContent='本番V10データが見つかりません。何も変更していません。管理者へこの画面を送ってください。';$('tech').textContent=JSON.stringify({key:KEY,exists:false,origin:location.origin,userAgent:navigator.userAgent},null,2);return}
const p=parse(raw);
if(!p.ok||!validState(p.value)){$('status').className='card bad';$('status').textContent='本番V10は存在しますが、安全に救出できるJSON形式として確認できませんでした。何も変更していません。';$('tech').textContent=JSON.stringify({key:KEY,exists:true,length:raw.length,json:p.ok,error:p.error||null,origin:location.origin,userAgent:navigator.userAgent},null,2);return}
state=p.value;summary=summaryOf(state);
if(summary.entries+summary.history===0){$('status').className='card bad';$('status').textContent='本番V10に勤務実績・締め履歴がありません。何も変更していません。';$('tech').textContent=JSON.stringify({key:KEY,summary,origin:location.origin,userAgent:navigator.userAgent},null,2);return}
$('status').className='card ok';$('status').innerHTML='<b>救出可能な本番データを確認しました。</b><br>この時点では何も変更していません。';
$('summary').hidden=false;$('summary').innerHTML='<div class="kv"><div>勤務実績</div><div>'+summary.entries+'件</div><div>締め履歴</div><div>'+summary.history+'件</div><div>勤務日</div><div>'+(summary.dates.join(', ')||'なし')+'</div></div>';
$('save').disabled=false;
$('tech').textContent=JSON.stringify({mode:'READ_ONLY_EXPORT_ONLY',key:KEY,origin:location.origin,entries:summary.entries,history:summary.history,dates:summary.dates,rawLength:raw.length,userAgent:navigator.userAgent},null,2);
$('save').onclick=()=>{try{
 const pack={rescueFormat:'taxi-pay-production-rescue-v1',exportedAt:new Date().toISOString(),origin:location.origin,userAgent:navigator.userAgent,key:KEY,state,summary};
 const text=JSON.stringify(pack,null,2),blob=new Blob([text],{type:'application/json'}),a=document.createElement('a');
 a.href=URL.createObjectURL(blob);a.download='taxi-pay-production-rescue-'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);
 $('result').hidden=false;$('result').className='card ok';$('result').innerHTML='<b>救出JSONの保存処理を実行しました。</b><br>元の本番データは変更・削除していません。<br><b>スマホの「ファイル」またはダウンロード一覧にJSONファイルがあることを確認してください。</b>';
 $('tech').textContent=JSON.stringify({status:'EXPORT_TRIGGERED',mode:'READ_ONLY_EXPORT_ONLY',key:KEY,summary,exportedBytes:text.length},null,2);
 }catch(e){$('result').hidden=false;$('result').className='card bad';$('result').textContent='JSON保存を開始できませんでした。元の本番データは変更していません。管理者へこの画面を送ってください。';$('tech').textContent=String(e)}};
})();
</script>
</body>
</html>
