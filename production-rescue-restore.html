<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>本番データ救出・復帰</title><style>body{font-family:system-ui;margin:14px;line-height:1.55;color:#17212b}button,input{font-size:16px;max-width:100%}button{min-height:48px;padding:12px 14px;margin:8px 0;width:100%}.card{border:1px solid #ccd5da;border-radius:12px;padding:14px;margin:12px 0}.ok{border-color:#0f5968;background:#f2fbfc}.warn{border-color:#a06000;background:#fff8ea}.danger{border-color:#a00000;background:#fff2f2}.hidden{display:none}.fileline{display:block;margin:14px 0}.fileline input{display:block;margin-top:6px;width:100%}.summary{font-weight:700}.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;margin:8px 0}.kv div:nth-child(odd){font-weight:700}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;background:#f5f7f8;padding:12px;border-radius:8px}.success{font-size:18px;font-weight:700}</style></head><body><h1>本番データ救出・復帰</h1><div class="card warn"><b>スマホ用・本番復帰専用</b><br>スマホに保存した救出JSONを、同じスマホの本番保存領域 <code>taxiPayPwaStateV10</code> に戻します。DEVELOPデータとGoogle Driveには触れません。</div><div class="card"><label class="fileline">救出JSONを選択<input id="file" type="file" accept="application/json,.json"><span id="fileinfo">未選択</span></label><button id="inspect">内容を確認</button></div><div id="preview" class="card hidden"></div><div id="restoreBox" class="card danger hidden"><b>復帰前に現在の本番データを二重退避します。</b><br>端末内の復旧スナップショットと復帰前JSONを作成してから、本番V10だけを書き換えます。<button id="restore">このJSONを本番へ復帰する</button></div><div id="result" class="card hidden"></div><pre id="log">救出JSONを選択してください。</pre><script>const KEY='taxiPayPwaStateV10',BACKUP_KEY='taxiPayProductionRescueBeforeRestoreV1',RECOVERY_KEY='taxiPayRecoverySnapshotsV1';const $=id=>document.getElementById(id);let normalized=null;function parse(raw){try{return{ok:true,value:JSON.parse(raw)}}catch(e){return{ok:false,error:e}}}function isState(s){return !!s&&typeof s==='object'&&!Array.isArray(s)&&Array.isArray(s.entries)&&Array.isArray(s.history)&&s.settings&&typeof s.settings==='object'}function normalizeInput(x){if(isState(x))return{state:x,format:'raw-production-state'};if(x&&['taxi-pay-production-rescue-v1','taxi-pay-production-rescue-merged-v1'].includes(x.rescueFormat)&&x.key===KEY&&isState(x.state))return{state:x.state,format:x.rescueFormat};throw new Error('対応する本番救出JSONではありません。救出元のJSONファイルを選び直してください。')}function sums(s){const e=s.entries;return{entries:e.length,history:s.history.length,dates:e.map(x=>x.date).filter(Boolean).sort(),gross:e.reduce((a,x)=>a+Number(x.grossRevenue??x.adjustedGrossSales??0),0)}}function dl(name,obj){try{const b=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);return true}catch{return false}}function snapshotCurrent(raw,stamp){if(raw===null)return;const p=parse(raw);if(!p.ok)return;const old=parse(localStorage.getItem(RECOVERY_KEY)||'[]');const rows=old.ok&&Array.isArray(old.value)?old.value:[];if(rows.at(-1)?.raw!==raw)rows.push({at:stamp,sourceKey:KEY,reason:'before:manual-rescue-restore',raw});localStorage.setItem(RECOVERY_KEY,JSON.stringify(rows.slice(-5)))}function validateIncoming(s){if(!isState(s))throw new Error('state形式が不正です');const summary=sums(s);if(summary.entries+summary.history<=0)throw new Error('勤務実績・締め履歴が0件のため復帰を中止しました');for(const e of s.entries){if(!e||typeof e!=='object'||!e.date)throw new Error('勤務実績に日付のないデータがあるため復帰を中止しました')}JSON.stringify(s);return summary}$('file').onchange=()=>{$('fileinfo').textContent=$('file').files[0]?.name||'未選択';normalized=null;$('preview').classList.add('hidden');$('restoreBox').classList.add('hidden');$('result').classList.add('hidden')};$('inspect').onclick=async()=>{try{const f=$('file').files[0];if(!f)throw new Error('救出JSONを選択してください');const raw=await f.text(),p=parse(raw);if(!p.ok)throw new Error('JSONを解析できません');normalized=normalizeInput(p.value);const incoming=validateIncoming(normalized.state),currentRaw=localStorage.getItem(KEY),cp=currentRaw===null?null:parse(currentRaw),current=cp&&cp.ok&&isState(cp.value)?sums(cp.value):{entries:0,history:0,dates:[],gross:0};$('preview').className='card ok';$('preview').innerHTML='<div class="summary">復帰内容の確認</div><div class="kv"><div>形式</div><div>'+normalized.format+'</div><div>救出件数</div><div>'+incoming.entries+'件</div><div>救出日付</div><div>'+(incoming.dates.join(', ')||'なし')+'</div><div>救出営収合計</div><div>'+incoming.gross.toLocaleString('ja-JP')+'円</div><div>現在の本番件数</div><div>'+current.entries+'件</div><div>現在の日付</div><div>'+(current.dates.join(', ')||'なし')+'</div></div>';$('preview').classList.remove('hidden');$('restoreBox').classList.remove('hidden');$('log').textContent=JSON.stringify({mode:'PREVIEW_ONLY',format:normalized.format,incoming,current},null,2)}catch(e){normalized=null;$('restoreBox').classList.add('hidden');$('log').textContent='ERROR: '+e.message}};$('restore').onclick=()=>{let beforeRaw=null,stamp='';try{if(!normalized)throw new Error('先に内容を確認してください');const incomingSummary=validateIncoming(normalized.state);beforeRaw=localStorage.getItem(KEY);stamp=new Date().toISOString();const beforeState=beforeRaw===null?null:(parse(beforeRaw).ok?parse(beforeRaw).value:null);const beforePack={rescueFormat:'taxi-pay-production-before-restore-v1',createdAt:stamp,key:KEY,state:beforeState};localStorage.setItem(BACKUP_KEY,JSON.stringify(beforePack));if(localStorage.getItem(BACKUP_KEY)!==JSON.stringify(beforePack))throw new Error('端末内の復帰前退避に失敗しました');snapshotCurrent(beforeRaw,stamp);const recoveryCheck=parse(localStorage.getItem(RECOVERY_KEY)||'[]');if(beforeRaw!==null&&(!recoveryCheck.ok||!Array.isArray(recoveryCheck.value)||!recoveryCheck.value.some(x=>x.raw===beforeRaw)))throw new Error('復旧スナップショットの作成に失敗しました');dl('taxi-pay-before-restore-'+stamp.replace(/[:.]/g,'-')+'.json',beforePack);const incomingRaw=JSON.stringify(normalized.state);localStorage.setItem(KEY,incomingRaw);const verifyRaw=localStorage.getItem(KEY);if(verifyRaw!==incomingRaw)throw new Error('書き込み後の完全一致照合に失敗しました');const vp=parse(verifyRaw);if(!vp.ok||!isState(vp.value))throw new Error('書き込み後JSONの再解析に失敗しました');const verified=sums(vp.value);if(verified.entries!==incomingSummary.entries||verified.history!==incomingSummary.history||JSON.stringify(verified.dates)!==JSON.stringify(incomingSummary.dates))throw new Error('書き込み後の件数・日付検証に失敗しました');$('result').className='card ok';$('result').innerHTML='<div class="success">復帰成功</div><div class="kv"><div>本番件数</div><div>'+verified.entries+'件</div><div>日付</div><div>'+verified.dates.join(', ')+'</div><div>営収合計</div><div>'+verified.gross.toLocaleString('ja-JP')+'円</div></div><button id="openProd">本番アプリを開いて確認</button>';$('result').classList.remove('hidden');$('restoreBox').classList.add('hidden');$('log').textContent=JSON.stringify({status:'RESTORE_SUCCESS',verified:true,key:KEY,format:normalized.format,summary:verified,backupKey:BACKUP_KEY,recoveryKey:RECOVERY_KEY},null,2);document.getElementById('openProd').onclick=()=>location.href='https://ttyseto-1027.github.io/taxi-pay-pwa/'}catch(e){try{if(beforeRaw===null)localStorage.removeItem(KEY);else localStorage.setItem(KEY,beforeRaw)}catch{}$('log').textContent='ERROR: '+e.message+'\n本番V10は復帰前データへロールバックしました。'}};</script></body></html>
