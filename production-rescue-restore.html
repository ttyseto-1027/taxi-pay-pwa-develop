<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>本番データ救出・復帰</title><style>body{font-family:system-ui;margin:14px;line-height:1.55;color:#17212b}button,input{font-size:16px;max-width:100%}button{min-height:48px;padding:12px 14px;margin:8px 0;width:100%}.card{border:1px solid #ccd5da;border-radius:12px;padding:14px;margin:12px 0}.ok{border-color:#0f5968;background:#f2fbfc}.warn{border-color:#a06000;background:#fff8ea}.danger{border-color:#a00000;background:#fff2f2}.hidden{display:none}.fileline{display:block;margin:14px 0}.fileline input{display:block;margin-top:6px;width:100%}.summary{font-weight:700}.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;margin:8px 0}.kv div:nth-child(odd){font-weight:700}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;background:#f5f7f8;padding:12px;border-radius:8px}.success{font-size:18px;font-weight:700}</style></head><body><h1>本番データ救出・復帰</h1><div class="card warn"><b>スマホ用・本番復帰専用</b><br>スマホに保存した救出JSONを、同じスマホの本番保存領域 <code>taxiPayPwaStateV10</code> に戻します。DEVELOPデータとGoogle Driveには触れません。</div><div class="card"><label class="fileline">救出JSONを選択<input id="file" type="file" accept="application/json,.json"><span id="fileinfo">未選択</span></label><button id="inspect">内容を確認</button></div><div id="preview" class="card hidden"></div><div id="restoreBox" class="card danger hidden"><b>復帰前の安全処理</b><br>現在の本番データを端末内の退避領域に保存し、さらに「復帰前JSON」をファイルとして保存してから復帰します。<button id="restore">このJSONを本番へ復帰する</button></div><div id="result" class="card hidden"></div><pre id="log">救出JSONを選択してください。</pre><script>const KEY='taxiPayPwaStateV10',BACKUP_KEY='taxiPayProductionRescueBeforeRestoreV1';const $=id=>document.getElementById(id);let doc=null;function clone(x){return JSON.parse(JSON.stringify(x))}function readFile(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{try{res(JSON.parse(r.result))}catch(e){rej(new Error('JSONを解析できません: '+e.message))}};r.onerror=()=>rej(new Error('ファイルを読み込めません'));r.readAsText(f)})}function validate(d){if(!['taxi-pay-production-rescue-v1','taxi-pay-production-rescue-merged-v1'].includes(d?.rescueFormat))throw new Error('本番救出JSONではありません');if(d?.key!==KEY)throw new Error('保存キーが本番V10ではありません');if(!d?.state||!Array.isArray(d.state.entries)||!Array.isArray(d.state.history))throw new Error('state形式が不正です');JSON.stringify(d.state)}function sums(s){const e=Array.isArray(s?.entries)?s.entries:[];return{entries:e.length,history:Array.isArray(s?.history)?s.history.length:0,dates:e.map(x=>x.date).filter(Boolean).sort(),gross:e.reduce((a,x)=>a+Number(x.grossRevenue||0),0)}}function dl(name,obj){const b=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}$('file').onchange=()=>{$('fileinfo').textContent=$('file').files[0]?.name||'未選択';doc=null;$('preview').classList.add('hidden');$('restoreBox').classList.add('hidden');$('result').classList.add('hidden')};$('inspect').onclick=async()=>{try{const f=$('file').files[0];if(!f)throw new Error('救出JSONを選択してください');doc=await readFile(f);validate(doc);const incoming=sums(doc.state),currentRaw=localStorage.getItem(KEY);let current=null;try{current=currentRaw?JSON.parse(currentRaw):null}catch{}const cur=sums(current);$('preview').className='card ok';$('preview').innerHTML='<div class="summary">復帰する救出データを確認してください</div><div class="kv"><div>救出件数</div><div>'+incoming.entries+'件</div><div>救出日付</div><div>'+(incoming.dates.join(', ')||'なし')+'</div><div>救出営収合計</div><div>'+incoming.gross.toLocaleString('ja-JP')+'円</div><div>現在の本番件数</div><div>'+cur.entries+'件</div><div>現在の日付</div><div>'+(cur.dates.join(', ')||'なし')+'</div></div>';$('preview').classList.remove('hidden');$('restoreBox').classList.remove('hidden');$('log').textContent=JSON.stringify({mode:'PREVIEW_ONLY',incoming,current:cur,rescueFormat:doc.rescueFormat},null,2)}catch(e){$('log').textContent='ERROR: '+e.message;$('restoreBox').classList.add('hidden')}};$('restore').onclick=()=>{try{if(!doc)throw new Error('先に内容を確認してください');validate(doc);const beforeRaw=localStorage.getItem(KEY);let beforeState=null;try{beforeState=beforeRaw?JSON.parse(beforeRaw):null}catch{}const stamp=new Date().toISOString();const beforePack={rescueFormat:'taxi-pay-production-before-restore-v1',createdAt:stamp,key:KEY,state:beforeState};localStorage.setItem(BACKUP_KEY,JSON.stringify(beforePack));dl('taxi-pay-before-restore-'+stamp.replace(/[:.]/g,'-')+'.json',beforePack);const incomingRaw=JSON.stringify(doc.state);localStorage.setItem(KEY,incomingRaw);const verifyRaw=localStorage.getItem(KEY);if(verifyRaw!==incomingRaw){if(beforeRaw===null)localStorage.removeItem(KEY);else localStorage.setItem(KEY,beforeRaw);throw new Error('書き込み後の照合に失敗したため、元の本番データへ戻しました');}const verify=JSON.parse(verifyRaw),sv=sums(verify);$('result').className='card ok';$('result').innerHTML='<div class="success">復帰成功</div><div class="kv"><div>本番件数</div><div>'+sv.entries+'件</div><div>日付</div><div>'+(sv.dates.join(', ')||'なし')+'</div><div>営収合計</div><div>'+sv.gross.toLocaleString('ja-JP')+'円</div></div><button id="openProd">本番アプリを開いて確認</button>';$('result').classList.remove('hidden');$('restoreBox').classList.add('hidden');$('log').textContent=JSON.stringify({status:'RESTORE_SUCCESS',verified:true,key:KEY,summary:sv,beforeRestoreBackupKey:BACKUP_KEY},null,2);document.getElementById('openProd').onclick=()=>location.href='https://ttyseto-1027.github.io/taxi-pay-pwa/';}catch(e){$('log').textContent='ERROR: '+e.message}};</script></body></html>
