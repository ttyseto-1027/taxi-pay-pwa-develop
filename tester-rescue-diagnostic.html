<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>テスター データ救出診断</title><style>body{font-family:system-ui;margin:18px;color:#17212b}button{font-size:16px;padding:12px;margin:8px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px}.note{padding:12px;border:2px solid #0f5968;border-radius:10px}</style></head><body><h1>テスター データ救出診断（読取専用）</h1><p class="note">端末内の給与シミュレーターデータを読み取るだけです。変更・削除・復元・同期は行いません。</p><button id="copy">診断結果をコピー</button><pre id="out"></pre><script>"use strict";(()=>{const fixed=['taxiPayStateSafetyBackupsV1','taxiPayStateDiagnosticsV1','taxiPayRecoverySnapshotsV1','taxiPayStorageDiagnosticsV1','taxiPayDevelopRecoverySnapshotsV1','taxiPayDevelopStorageDiagnosticsV1'];for(let v=10;v>=1;v--){fixed.push('taxiPayPwaStateV'+v);fixed.push('taxiPayPwaDevelopStateV'+v)}const discovered=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&/taxi|pay|salary|pwa|recovery|backup|diagnostic/i.test(k)&&!fixed.includes(k))discovered.push(k)}}catch{}const keys=[...new Set([...fixed,...discovered])];function summarizeObject(x){if(!x||typeof x!=='object')return{};return{entries:Array.isArray(x.entries)?x.entries.length:null,history:Array.isArray(x.history)?x.history.length:null,initialized:x.initialized??null}}function inspect(k){let raw;try{raw=localStorage.getItem(k)}catch(e){return{key:k,error:String(e)}}if(raw===null)return{key:k,exists:false};let parsed;try{parsed=JSON.parse(raw)}catch(e){return{key:k,exists:true,length:raw.length,json:false,error:String(e)}}const base={key:k,exists:true,length:raw.length,json:true,type:Array.isArray(parsed)?'array':typeof parsed,...summarizeObject(parsed)};if(Array.isArray(parsed)){base.items=parsed.map((item,index)=>{let x=item;if(item&&typeof item==='object'&&typeof item.raw==='string'){try{x=JSON.parse(item.raw)}catch{}}const s=summarizeObject(x);return{index,at:item?.at??null,sourceKey:item?.sourceKey??null,reason:item?.reason??null,...s,data:(Number(s.entries)||0)+(Number(s.history)||0)>0?x:null}})}else if((Number(base.entries)||0)+(Number(base.history)||0)>0){base.data=parsed}return base}const rows=keys.map(inspect);const report={generatedAt:new Date().toISOString(),origin:location.origin,path:location.pathname,userAgent:navigator.userAgent,rows};const text=JSON.stringify(report,null,2);document.getElementById('out').textContent=text;document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(text);alert('コピーしました')}catch{const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();alert('コピーしました')}}})();</script></body></html>
